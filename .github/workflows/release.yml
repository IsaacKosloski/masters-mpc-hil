name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Na R2 entra aqui a compilação do deck e o PDF anexado à release.
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
